<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Контакты</title>
	<link rel="stylesheet" href="style.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="script.js" defer></script>
</head>
<body>
	<header>
		<nav class="navbar navbar-expand">
			<div class="container">
				<a class="navbar-brand" href="index.html">Kingdom Come II</a>
				<div class="navbar-nav">
					<a class="nav-link" href="index.html">Главная</a>
					<a class="nav-link" href="about.html">Об игре</a>
					<a class="nav-link active" href="contacts.html">Контакты</a>
				</div>
			</div>
		</nav>
	</header>
	<main class="container py-4">
		<h1>Контакты</h1>
		<form id="contactForm">
			<input class="form-control mb-3" type="text" id="name" placeholder="Имя" required>
			<input class="form-control mb-3" type="email" id="email" placeholder="Email" required>
			<textarea class="form-control mb-3" id="comment" placeholder="Сообщение" required></textarea>
			<button class="btn btn-primary" type="submit">Отправить</button>
			<div id="formMessage"></div>
		</form>
	</main>
	<footer class="text-center p-3">Kingdom Come: Deliverance II</footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
